    Projects:
      - name: PatchCon
        url: https://github.com/Chaomeng-Lu/PatchCon
        date: 2026
        summary: Patch-aware weighted supervised contrastive learning for vulnerability detection (CodeBERT, PyTorch).
        highlights:
          - >-
            Treats vulnerable–patched function pairs as weighted hard negatives; +58% pairwise accuracy on PairVul-Linux over the strongest reproduced baseline.
      - name: ICVul dataset
        url: https://github.com/Chaomeng-Lu/ICVul
        date: 2025
        summary: >-
          Well-labeled C/C++ vulnerability dataset built from real-world CVEs and fix commits across 800+ GitHub repositories, with SZZ-traced vulnerability-contributing
          commits.
      - name: Self-hosted MLflow Tracking Platform on Azure
        summary: >-
          Deployed a self-hosted MLflow Tracking Server on an Azure Ubuntu VM with Nginx reverse proxy, Basic Auth, systemd service management, and artifact
          tracking for centralized experiment management.
